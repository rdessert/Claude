<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evasive Button</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        h1 {
            color: white;
            margin-bottom: 40px;
            text-align: center;
            font-size: 2.5rem;
        }

        .button-container {
            display: flex;
            gap: 30px;
            position: relative;
        }

        button {
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }

        #yesBtn:hover {
            background-color: #45a049;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            left: 180px;
            transition: none;
        }

        #noBtn:hover {
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <h1>Do you agree?</h1>
    <div class="button-container">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Detection distance in pixels
        const detectionDistance = 100;

        // Track mouse position
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            checkProximity();
        });

        function checkProximity() {
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            // Calculate distance from mouse to button center
            const distance = Math.sqrt(
                Math.pow(mouseX - btnCenterX, 2) +
                Math.pow(mouseY - btnCenterY, 2)
            );

            // If mouse is too close, move the button
            if (distance < detectionDistance) {
                moveButton();
            }
        }

        function moveButton() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Generate random position, ensuring button stays within viewport
            const maxX = windowWidth - btnWidth - 20;
            const maxY = windowHeight - btnHeight - 20;

            let newX, newY;
            let attempts = 0;
            const maxAttempts = 10;

            // Try to find a position far enough from the cursor
            do {
                newX = Math.random() * maxX + 10;
                newY = Math.random() * maxY + 10;

                const distanceFromMouse = Math.sqrt(
                    Math.pow(mouseX - newX, 2) +
                    Math.pow(mouseY - newY, 2)
                );

                if (distanceFromMouse > detectionDistance * 2) {
                    break;
                }
                attempts++;
            } while (attempts < maxAttempts);

            // Apply the new position
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        // Prevent clicking the No button
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Yes button action
        yesBtn.addEventListener('click', () => {
            alert('Great choice! 😊');
        });
    </script>
</body>
</html>
